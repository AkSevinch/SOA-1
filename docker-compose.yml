services:
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    image: soa/catalog-service:0.1.0
    container_name: soa-catalog-service
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
